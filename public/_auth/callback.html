<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing in…</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f8faf9;
        }

        .card {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e5e7eb;
            border-top-color: #00843d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error {
            color: #d91515;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="spinner" id="spinner"></div>
        <p id="status">Signing in…</p>
        <p class="error" id="error" style="display:none"></p>
    </div>
    <script>
        /**
         * /_auth/callback.html — OAuth PKCE callback handler.
         *
         * Exchanges the authorization code for tokens using the reports_public
         * Cognito app client (browser-based PKCE, no client secret required).
         * Stores the ID token in a cookie so the Lambda@Edge auth gate allows
         * subsequent requests through.
         *
         * Uses Web Crypto API for PKCE — supported in all modern browsers.
         */

        (async function () {
            const statusEl = document.getElementById('status');
            const errorEl = document.getElementById('error');
            const spinnerEl = document.getElementById('spinner');

            function showError(msg) {
                statusEl.style.display = 'none';
                spinnerEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.textContent = msg;
            }

            try {
                // ═══ Configuration ═══
                const COGNITO_DOMAIN = 'waqfenau-members-preview.auth.ap-southeast-2.amazoncognito.com';
                const CLIENT_ID = '2fmokpfcfbpl2qu2sctpmlbp7g';
                const REDIRECT_URI = window.location.origin + '/_auth/callback.html';

                // ═══ Parse authorization code ═══
                const params = new URLSearchParams(window.location.search);
                const code = params.get('code');
                const error = params.get('error');

                if (error) {
                    showError('Login cancelled or failed: ' + error);
                    return;
                }

                if (!code) {
                    showError('No authorization code received. Please try logging in again.');
                    return;
                }

                // ═══ Retrieve PKCE code verifier from cookie ═══
                // Lambda@Edge sets __wn_pkce cookie (httpOnly, 5 min TTL)
                const codeVerifier = document.cookie
                    .split('; ')
                    .find(row => row.startsWith('__wn_pkce='))
                    ?.split('=')[1];

                // ═══ Exchange code for tokens ═══
                statusEl.textContent = 'Exchanging authorization code…';

                const body = new URLSearchParams({
                    grant_type: 'authorization_code',
                    client_id: CLIENT_ID,
                    code: code,
                    redirect_uri: REDIRECT_URI,
                });

                if (codeVerifier) {
                    body.append('code_verifier', codeVerifier);
                }

                const tokenResponse = await fetch('https://' + COGNITO_DOMAIN + '/oauth2/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: body.toString(),
                });

                if (!tokenResponse.ok) {
                    const text = await tokenResponse.text();
                    console.error('Token exchange failed:', tokenResponse.status, text);
                    showError('Login failed. Please try again. (' + tokenResponse.status + ')');
                    return;
                }

                const tokens = await tokenResponse.json();

                if (!tokens.id_token) {
                    showError('No ID token received from Cognito.');
                    return;
                }

                // ═══ Store tokens ═══
                statusEl.textContent = 'Setting up session…';

                // Store ID token in a cookie for Lambda@Edge to read
                // Non-httpOnly because set via JS, but SameSite=Lax + Secure
                document.cookie = '__wn_idtoken=' + tokens.id_token +
                    '; Path=/; Secure; SameSite=Lax; Max-Age=3600';

                if (tokens.refresh_token) {
                    document.cookie = '__wn_refresh=' + tokens.refresh_token +
                        '; Path=/; Secure; SameSite=Lax; Max-Age=2592000';
                }

                // Clean up PKCE verifier
                sessionStorage.removeItem('wn_code_verifier');

                // ═══ Redirect to main page ═══
                statusEl.textContent = 'Signed in! Redirecting…';
                window.location.href = '/';

            } catch (err) {
                console.error('Callback error:', err);
                showError('An unexpected error occurred. Please try again.');
            }
        })();
    </script>
</body>

</html>
